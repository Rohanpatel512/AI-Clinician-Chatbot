<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./style/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <title>Clincian Assistant</title>
    </head>
    <body>
        <div class="app-shell">
            <header class="header">
                <div class="brand-pill">AI Clinician</div>
                <h1><span id="greeting"></span></h1>
                <p id="description">Your AI assistant for clinical questions and medical information.</p>
            </header>

            <main class="chat-container" aria-label="Clinician assistant chat">
                <div class="chat-messages" aria-live="polite"></div>
                <div class="composer-wrapper">
                    <div id="thinking-indicator" class="hidden">
                        <div class="thinking-bubble">
                            <span>Thinking</span>
                            <div class="dots" aria-hidden="true">
                                <span>.</span>
                                <span>.</span>
                                <span>.</span>
                            </div>
                        </div>
                    </div>

                    <div class="messages-container">
                        <textarea id="messages" placeholder="Ask a clinical question, e.g. What are the symptoms of diabetes?"></textarea>
                        <button type="submit" id="send-btn" aria-label="Send message">
                            <i class="fa fa-paper-plane-o" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </main>
        </div>

        <script src="./js/runtime-config.js"></script>
        <script src="./js/script.js"></script>
    </body>
</html>
